<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

    <title>User List</title>
</head>

<body>

    <!-- ปุ่ม Day and Night -->
    <header class="mb-5">
        <div class="container mt-5">

            <div class="d-flex justify-content-end">
                <div class="btn-group">

                    <button class="btn btn-secondary btn-sm"
                            data-bs-theme-value="dark">
                        Dark
                    </button>

                    <button class="btn btn-light btn-sm"
                            data-bs-theme-value="light">
                        Light
                    </button>

                </div>
            </div>

        </div>
    </header>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/darkmodetoggle.js"></script>
    
    
<div class="container mt-4">

    <!-- หัวข้อ -->
    <h2>Users</h2>

    <div class="row align-items-center mt-3">

        <!-- Search: 4 columns -->
        <div class="col-md-4">
            <input
                type="text"
                class="form-control"
                placeholder="Search Users"
            >
        </div>

        <!-- Navigation: 8 columns -->
        <div class="col-md-8">
            <div class="user-menu d-flex justify-content-end align-items-center gap-3">

                <span>Reputation</span>

                <span class="text-bg-primary rounded-3 p-2">
                    New Users
                </span>

                <span>Editors</span>

                <span>Moderators</span>

            </div>
        </div>

    </div>
</div>


<!-- User Cards -->
<div class="container mt-4">
    <div class="row">

        <!-- Card 1: John Doe -->
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex gap-3 align-items-start">

                        <img src="https://i.pravatar.cc/100?img=12"
                             class="img-fluid rounded-circle"
                             width="70" height="70" alt="John Doe">

                        <div>
                            <button type="button"
                                    class="btn btn-link p-0 fw-bold"
                                    data-bs-toggle="popover"
                                    data-bs-trigger="focus"
                                    data-bs-title="John Doe"
                                    data-bs-content="john@example.com">
                                John Doe
                            </button>

                            <p class="text-muted mb-2">Troy, MI</p>

                            <span class="badge text-bg-secondary">Nature</span>
                            <span class="badge text-bg-secondary">Travel</span>
                            <span class="badge text-bg-secondary">Sport</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Card 2: Lehla Nichols -->
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex gap-3 align-items-start">

                        <img src="https://i.pravatar.cc/100?img=47"
                             class="img-fluid rounded-circle"
                             width="70" height="70" alt="Lehla Nichols">

                        <div>
                            <button type="button"
                                    class="btn btn-link p-0 fw-bold"
                                    data-bs-toggle="popover"
                                    data-bs-trigger="focus"
                                    data-bs-title="Lehla Nichols"
                                    data-bs-content="lehla@example.com">
                                Lehla Nichols
                            </button>

                            <p class="text-muted mb-2">Fort Worth, TX</p>

                            <span class="badge text-bg-secondary">Fashion</span>
                            <span class="badge text-bg-secondary">STEM</span>
                            <span class="badge text-bg-secondary">Architecture</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Card 3: Annie Rice -->
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex gap-3 align-items-start">

                        <img src="https://i.pravatar.cc/100?img=44"
                             class="img-fluid rounded-circle"
                             width="70" height="70" alt="Annie Rice">

                        <div>
                            <button type="button"
                                    class="btn btn-link p-0 fw-bold"
                                    data-bs-toggle="popover"
                                    data-bs-trigger="focus"
                                    data-bs-title="Annie Rice"
                                    data-bs-content="annie@example.com">
                                Annie Rice
                            </button>

                            <p class="text-muted mb-2">Troy, MI</p>

                            <span class="badge text-bg-secondary">Electronics</span>
                            <span class="badge text-bg-secondary">Tech</span>
                            <span class="badge text-bg-secondary">Music</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Card 4: Your own user -->
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex gap-3 align-items-start">

                        <img src="https://i.pravatar.cc/100?img=11"
                             class="img-fluid rounded-circle"
                             width="70" height="70" alt="Your User">

                        <div>
                            <button type="button"
                                    class="btn btn-link p-0 fw-bold"
                                    data-bs-toggle="popover"
                                    data-bs-trigger="focus"
                                    data-bs-title="Your Name"
                                    data-bs-content="yourname@example.com">
                                KJ
                            </button>

                            <p class="text-muted mb-2">Hatyai</p>

                            <span class="badge text-bg-secondary">sleeping</span>
                            <span class="badge text-bg-secondary">Eating</span>
                            <span class="badge text-bg-secondary">Travel</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>
    const popoverTriggerList =
        document.querySelectorAll('[data-bs-toggle="popover"]');

    [...popoverTriggerList].forEach(element => {
        new bootstrap.Popover(element);
    });
</script>
</body>
</html>
